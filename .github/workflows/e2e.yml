name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
            echo code=true >>"$GITHUB_OUTPUT"
          elif grep -qvE '(\.md|^LICENSE|^\.gitignore|^docs/.*)$' <<<"$files"; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  # A job skipped by its if condition still satisfies the required e2e check.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            e2e/results.tsv
            e2e/logs/
