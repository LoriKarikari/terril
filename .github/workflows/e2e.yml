name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
            echo code=true >>"$GITHUB_OUTPUT"
          elif grep -qvE '(\.md|^LICENSE|^\.gitignore|^docs/.*|^\.release-please-manifest\.json)$' <<<"$files"; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test app files are committed
        run: test -z "$(git ls-files --others --ignored --exclude-standard e2e/testdata | git check-ignore -v --stdin | grep '^.gitignore:' | grep -v node_modules)"

  # A job skipped by its if condition still satisfies the required e2e check.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # BuildKit garbage-collects its cache when free disk drops below 20%, which deletes cached
      # steps mid-run on a stock runner. These preinstalled SDKs are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install dive
        run: |
          curl -fsSLo /tmp/dive.deb https://github.com/wagoodman/dive/releases/download/v0.13.1/dive_0.13.1_linux_amd64.deb
          sudo apt-get install -y /tmp/dive.deb
      - run: cd e2e && go test -count=1 -timeout 60m -parallel 4 -run TestApps .
      - if: always()
        run: |
          df -h /
          docker system df
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            e2e/results.tsv
            e2e/logs/
