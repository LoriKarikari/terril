name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            e2e/results.tsv
            e2e/logs/
