name: e2e

on:
  push:
    branches: [main]
  pull_request:

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=github-releases depName=wagoodman/dive
  DIVE_VERSION: v0.13.1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
            echo code=true >>"$GITHUB_OUTPUT"
          elif grep -qvE '(\.md|^LICENSE|^\.gitignore|^docs/.*|^\.release-please-manifest\.json)$' <<<"$files"; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION ./...
      - name: Test app files are committed
        run: test -z "$(git ls-files --others --ignored --exclude-standard e2e/testdata | git check-ignore -v --stdin | grep '^.gitignore:' | grep -v node_modules)"

  # A job skipped by its if condition still satisfies the required e2e check.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install dive
        run: |
          curl -fsSLo /tmp/dive.deb "https://github.com/wagoodman/dive/releases/download/$DIVE_VERSION/dive_${DIVE_VERSION#v}_linux_amd64.deb"
          sudo apt-get install -y /tmp/dive.deb
      - run: cd e2e && go test -count=1 -timeout 60m -parallel 4 -run TestApps .
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            e2e/results.tsv
            e2e/logs/

  cache:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install dive
        run: |
          curl -fsSLo /tmp/dive.deb "https://github.com/wagoodman/dive/releases/download/$DIVE_VERSION/dive_${DIVE_VERSION#v}_linux_amd64.deb"
          sudo apt-get install -y /tmp/dive.deb
      - run: cd e2e && go test -count=1 -timeout 60m -parallel 1 -run TestCache .
