version: 2
builds:
  - main: ./cmd/terril
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
# release-please writes the release notes; GoReleaser only uploads the archives.
release:
  mode: keep-existing
changelog:
  disable: true
