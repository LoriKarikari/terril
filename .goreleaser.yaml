version: 2
builds:
  - main: ./cmd/terril
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat(\([a-z0-9-]+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^fix(\([a-z0-9-]+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^perf(\([a-z0-9-]+\))?!?:.+$'
      order: 2
